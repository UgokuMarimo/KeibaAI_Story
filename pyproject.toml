[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keiba-ai"
version = "0.1.0"
description = "AI-powered Horse Racing Prediction & Analysis System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "lightgbm>=4.3.0",
    "shap>=0.45.0",
    "optuna>=3.6.1",
    "scikit-learn>=1.4.2",
    "beautifulsoup4>=4.12.3",
    "requests>=2.31.0",
    "lxml>=5.2.1",
    "tqdm>=4.66.2",
    "discord-webhook>=1.3.0",
    "google-generativeai>=0.5.2",
    "python-dotenv>=1.0.1",
    "playwright>=1.43.0",
    "chromadb>=0.5.0",
    "streamlit>=1.33.0",
    "matplotlib>=3.8.4",
    "joblib>=1.4.0",
    "tenacity>=8.3.0",
    "typing_extensions>=4.11.0",
    "psycopg2-binary>=2.9.12"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
